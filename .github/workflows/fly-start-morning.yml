name: Fly - Start morning

# Starts dream-massage Fly machine(s) before the shop opens at 08:00.
# GitHub Actions cron uses the timezone field (Africa/Casablanca = Morocco,
# UTC+1 year-round; no DST since 2018).
# 07:55 Morocco = 5 minutes before opening.
on:
  schedule:
    - cron: "55 7 * * *"
      timezone: "Africa/Casablanca"
  workflow_dispatch: {}

env:
  FLY_APP: dream-massage
  PROD_URL: https://dream-massage.fly.dev
  TARGET_STATE: started

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Verify FLY_API_TOKEN secret
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "::error::FLY_API_TOKEN secret is missing. Add it under repo Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          echo "FLY_API_TOKEN secret is present."

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure jq is available
        run: |
          if command -v jq >/dev/null 2>&1; then
            echo "jq is already available: $(jq --version)"
          else
            echo "jq not found, installing..."
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      - name: Machines before start
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "==> Machines BEFORE start ($(date -u +%Y-%m-%dT%H:%M:%SZ) UTC):"
          flyctl machines list -a "$FLY_APP" --json | jq -r '.[] | "  \(.id)  \(.name)  state=\(.state)"'

      - name: Start Fly machine(s)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Intentionally NOT using `set -e`: a single machine already being
          # in the target state must not abort the whole job.
          set +e
          set -u
          set -o pipefail

          APP="$FLY_APP"

          echo "flyctl version: $(flyctl version)"
          echo "==> Listing machines for app: $APP"

          MACHINES_JSON=$(flyctl machines list -a "$APP" --json)
          LIST_STATUS=$?
          if [ $LIST_STATUS -ne 0 ]; then
            echo "::error::Failed to list machines for app $APP (exit $LIST_STATUS)."
            echo "$MACHINES_JSON"
            exit 1
          fi

          MACHINE_COUNT=$(echo "$MACHINES_JSON" | jq 'length')
          if [ "$MACHINE_COUNT" -eq 0 ]; then
            echo "No machines found for app $APP. Nothing to do."
            exit 0
          fi
          echo "Found $MACHINE_COUNT machine(s)."

          FAILED=0
          STARTED=0
          SKIPPED=0

          while IFS=$'\t' read -r ID NAME STATE; do
            echo "-------------------------------------------"
            echo "Machine found : $ID ($NAME)"
            echo "Current state : $STATE"

            if [ "$STATE" = "$TARGET_STATE" ]; then
              echo "Action        : none (already started)"
              echo "Final state   : $STATE"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "Action        : starting..."
            OUTPUT=$(flyctl machine start "$ID" -a "$APP" 2>&1)
            RC=$?

            if [ $RC -eq 0 ]; then
              echo "$OUTPUT"
              STARTED=$((STARTED + 1))
            elif echo "$OUTPUT" | grep -qiE "already.*started|is already in a started state"; then
              echo "Machine reports it is already started (race condition) - treated as success."
              SKIPPED=$((SKIPPED + 1))
            else
              echo "::error::Failed to start machine $ID"
              echo "$OUTPUT"
              FAILED=1
            fi

            FINAL_STATE=$(flyctl machine status "$ID" -a "$APP" --json 2>/dev/null | jq -r '.state // "unknown"')
            echo "Final state   : $FINAL_STATE"
          done < <(echo "$MACHINES_JSON" | jq -r '.[] | [.id, .name, .state] | @tsv')

          echo "-------------------------------------------"
          echo "Summary: started=$STARTED skipped=$SKIPPED failed=$FAILED"

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more machines failed to start."
            exit 1
          fi

          echo "==> Done. All machines are in the target state ($TARGET_STATE)."
          exit 0

      - name: Health check (warm up + verify)
        run: |
          set +e
          URL="${PROD_URL}/health"
          echo "==> Health check: $URL"
          echo "Waiting 10s for app process to bind..."
          sleep 10

          for attempt in 1 2 3 4 5 6; do
            echo "--- Health attempt $attempt/6 ---"
            HTTP=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 "$URL")
            BODY=$(cat /tmp/health.json 2>/dev/null || echo "{}")
            echo "HTTP status : $HTTP"
            echo "Response    : $BODY"

            if [ "$HTTP" = "200" ]; then
              OK=$(echo "$BODY" | jq -r '.ok // false' 2>/dev/null || echo "false")
              if [ "$OK" = "true" ]; then
                echo "==> Health check PASSED (ok=true, database connected)."
                exit 0
              fi
              echo "HTTP 200 but ok!=true — app may still be starting."
            else
              echo "Non-200 response — machine or app may still be booting."
            fi
            sleep 10
          done

          echo "::warning::Health check did not return ok=true after 6 attempts. Machine may be started but app/DB slow — verify manually."
          exit 0

      - name: Machines after start
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "==> Machines AFTER start ($(date -u +%Y-%m-%dT%H:%M:%SZ) UTC):"
          flyctl machines list -a "$FLY_APP" --json | jq -r '.[] | "  \(.id)  \(.name)  state=\(.state)"'
