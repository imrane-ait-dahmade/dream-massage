name: Auto Shift Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
      timezone: "Africa/Casablanca"

jobs:
  auto-shift:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto-shift
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::APP_URL secret is missing."
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is missing."
            exit 1
          fi
          APP_URL="${APP_URL%/}"
          HTTP=$(curl -sS -o /tmp/auto-shift-response.json -w "%{http_code}" -X POST \
            "$APP_URL/internal/jobs/auto-shift" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Auto-shift endpoint returned HTTP $HTTP"
            cat /tmp/auto-shift-response.json 2>/dev/null || true
            exit 1
          fi
          echo "Auto-shift check succeeded (HTTP $HTTP)"
